name: Build Yocto

on:
  schedule:
    - cron: '0 3 * * 1-6'  # Every day except Sunday at 3:00 AM UTC
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: "full" # values: pr | full | weekly
    outputs:
      artifacts_url:
        description: "URL to retrieve build artifacts"
        value: ${{ jobs.create-output.outputs.url }}

permissions:
  contents: read

# Concurrency is used to prevent multiple workflows from running for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

env:
  CACHE_DIR: /efsx/qli/meta-qcom
  KAS_CLONE_DEPTH: 1
  KAS_CONTAINER: ${{ github.workspace }}/kas-container
  KAS_CONTAINER_IMAGE: ghcr.io/siemens/kas/kas@sha256:3f3d3257e8d4ca3adfcb2e0025e6da24339fb8d68a6999ca36c37381351582d5 # 5.5-9-g0555188

jobs:
  kas-setup:
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setting up kas-container
        run: |
          docker create --name kas ${KAS_CONTAINER_IMAGE}
          docker cp kas:/usr/local/bin/kas-container $KAS_CONTAINER
          LATEST=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          if ! grep -q "KAS_CONTAINER_SCRIPT_VERSION=\"${LATEST}\"" $KAS_CONTAINER ; then
            echo "Version "${LATEST}" of kas is available, please update "KAS_CONTAINER_IMAGE: $KAS_CONTAINER_IMAGE""
          fi

      - name: Run kas lock
        run: |
          ${KAS_CONTAINER} lock --update ci/base.yml:ci/qcom-distro.yml

      - name: Upload kas
        uses: actions/upload-artifact@v6
        with:
          name: kas
          if-no-files-found: error
          path: |
            ci/*.lock.yml
            kas-container

  yocto-run-checks:
    needs: kas-setup
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download kas
        uses: actions/download-artifact@v7
        with:
          name: kas

      - name: Setting up kas-container
        run: |
          chmod +x $KAS_CONTAINER

      - name: Run yocto-check-layer
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-check-layer.sh

      - name: Run Yocto patchreview
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-patchreview.sh

  compile-env:
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: ubuntu-latest
    outputs:
      CACHE_DIR: ${{ steps.compile_env.outputs.CACHE_DIR }}
    steps:
      # the env context is not available in the inputs of a reusable workflow call
      - name: Setup compile variables
        id: compile_env
        run: |
          echo "CACHE_DIR=${CACHE_DIR}" >> $GITHUB_OUTPUT

  # Builds the common core (native tools, toolchain and the qcom-distro
  # images of the generic machine) once, so the compile_stage2 seeds reuse it
  # instead of each building it.
  compile_stage1:
    needs: [kas-setup, compile-env]
    if: github.repository_owner == 'qualcomm-linux'
    permissions:
      contents: read
      packages: read
      actions: read
    uses: $/.github/workflows/compile.yml
    with:
      name: qcom-armv8a/qcom-distro
      world: false
      machine: 'qcom-armv8a'
      distro_yaml: ':ci/qcom-distro.yml'
      distro_name: 'qcom-distro'
      kernel_yaml: ''
      kernel_dirname: ''
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}
      profile: ${{ inputs.profile }}

  # One seed build per distro family and target tune.
  compile_stage2:
    needs: [compile_stage1, compile-env]
    if: github.repository_owner == 'qualcomm-linux'
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: true
      matrix:
        machine:
          - glymur-crd
          - rb3gen2-core-kit
        distro:
          - name: qcom-distro
            yamlfile: ':ci/qcom-distro.yml'
          - name: qcom-distro-catchall
            yamlfile: ':ci/qcom-distro-catchall.yml'
        kernel:
          - type: default
            dirname: ""
            yamlfile: ""
        include:
          # qcom-armv8a qcom-distro is built by compile_stage1
          - machine: qcom-armv8a
            distro:
                name: qcom-distro-catchall
                yamlfile: ':ci/qcom-distro-catchall.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
    uses: $/.github/workflows/compile.yml
    with:
      name: ${{ matrix.machine }}/${{ matrix.distro.name }}${{ matrix.kernel.dirname }}
      # One world build per machine and distro family is enough for compile
      # coverage: qcom-distro-catchall is qcom-distro with selinux and sota
      # added (sota only opts out ptest), so the remaining distro and kernel
      # combinations only repeat already-covered world builds. qcom-armv7a has no
      # qcom-distro-catchall variant, so its qcom-distro build is the
      # distro-family world build for that machine.
      world: ${{ (matrix.distro.name == 'qcom-distro-catchall' || (matrix.machine == 'qcom-armv7a' && matrix.distro.name == 'qcom-distro')) && matrix.kernel.type == 'default' }}
      machine: ${{matrix.machine}}
      distro_yaml: ${{matrix.distro.yamlfile}}
      distro_name: ${{matrix.distro.name}}
      kernel_yaml: ${{matrix.kernel.yamlfile}}
      kernel_dirname: ${{matrix.kernel.dirname}}
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}
      profile: ${{ inputs.profile }}

  compile_sdk:
    needs: [compile_stage2, compile-env]
    if: github.repository_owner == 'qualcomm-linux'
    permissions:
      contents: read
      packages: read
      actions: read
    uses: $/.github/workflows/compile.yml
    with:
      name: qcom-armv8a/qcom-distro-sdk
      sdk: true
      target: false
      world: false
      machine: 'qcom-armv8a'
      distro_yaml: ':ci/qcom-distro.yml'
      distro_name: 'qcom-distro-sdk'
      kernel_yaml: ''
      kernel_dirname: ''
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}
      profile: ${{ inputs.profile }}

  compile_stage3:
    needs: [compile_stage2, compile-env]
    if: github.repository_owner == 'qualcomm-linux'
    permissions:
      contents: read
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        machine:
          - glymur-crd
          - iq-615-evk
          - iq-8275-evk
          - iq-9075-evk
          - iq-x7181-evk
          - kaanapali-mtp
          - qcm6490-idp
          - qcom-armv8a
          - qcs615-ride
          - qcs8300-ride-sx
          - qcs9100-ride-sx
          - rb1-core-kit
          - rb3gen2-core-kit
          - sm8750-mtp
        distro:
          - name: qcom-distro
            yamlfile: ':ci/qcom-distro.yml'
          - name: qcom-distro-catchall
            yamlfile: ':ci/qcom-distro-catchall.yml'
          - name: performance
            yamlfile: ':ci/qcom-distro.yml:ci/performance.yml:ci/nospdx.yml'
            profile: full
        kernel:
          - type: default
            dirname: ""
            yamlfile: ""
          - type: qcom-next
            dirname: "_linux-qcom-next"
            yamlfile: ":ci/linux-qcom-next.yml"
          - type: rt-6.18
            dirname: "_linux-qcom-rt-6.18"
            yamlfile: ":ci/linux-qcom-rt-6.18.yml"
        exclude:
          # Exclude jobs from compile_stage1 and compile_stage2
          - machine: glymur-crd
            distro:
                name: qcom-distro
            kernel:
                type: default
          - machine: glymur-crd
            distro:
                name: qcom-distro-catchall
            kernel:
                type: default
          - machine: qcom-armv8a
            distro:
                name: qcom-distro
            kernel:
                type: default
          - machine: qcom-armv8a
            distro:
                name: qcom-distro-catchall
            kernel:
                type: default
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro
            kernel:
                type: default
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro-catchall
            kernel:
                type: default
          # qcom-distro coverage is enough for the non-default qcom-next
          # kernel; 6.18 is the official and supported kernel on this branch
          - distro:
                name: qcom-distro-catchall
            kernel:
                type: qcom-next
          - distro:
                name: performance
            kernel:
                type: qcom-next
        include:
          # Additional builds for specific machines
          - machine: qcom-armv8a
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: additional
                dirname: "_linux-yocto-dev"
                yamlfile: ":ci/linux-yocto-dev.yml"
          - machine: iq-9075-evk
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: qcom-next-rt
                dirname: "_linux-qcom-next-rt"
                yamlfile: ":ci/linux-qcom-next-rt.yml"
          - machine: qcom-armv7a
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro-multimedia-image.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: qcom-armv8a
            distro:
                name: qcom-distro-multimedia-demo-image
                yamlfile: ':ci/qcom-distro-multimedia-demo-image.yml'
                profile: weekly
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro-multimedia-demo-image
                yamlfile: ':ci/qcom-distro-multimedia-demo-image.yml'
                profile: weekly
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: glymur-crd
            distro:
                name: qcom-distro-multimedia-demo-image
                yamlfile: ':ci/qcom-distro-multimedia-demo-image.yml'
                profile: weekly
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: qcs615-ride
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom
                dirname: "_u-boot-qcom"
                yamlfile: ":ci/u-boot-qcom.yml"
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom
                dirname: "_u-boot-qcom"
                yamlfile: ":ci/u-boot-qcom.yml"
          - machine: rb3gen2-core-kit-open-fw
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
    uses: $/.github/workflows/compile.yml
    with:
      name: ${{ matrix.machine }}/${{ matrix.distro.name }}${{ matrix.kernel.dirname }}
      # Which profiles build this entry. Entries without distro.profile are
      # built by every profile; an entry marked with distro.profile is built by
      # that profile and by the wider ones above it, ordered pr < full (push
      # and nightly) < weekly. Add "profile: weekly" to the distro entry of a
      # target that is too expensive to build every night.
      enabled: ${{ (matrix.distro.profile || 'any') == 'any' || (matrix.distro.profile == 'full' && inputs.profile != 'pr') || (matrix.distro.profile == 'weekly' && inputs.profile == 'weekly') }}
      # One world build per machine and distro family is enough for compile
      # coverage: qcom-distro-catchall is qcom-distro with selinux and sota
      # added (sota only opts out ptest), so the remaining distro and kernel
      # combinations only repeat already-covered world builds. qcom-armv7a has no
      # qcom-distro-catchall variant, so its qcom-distro build is the
      # distro-family world build for that machine.
      world: ${{ (matrix.distro.name == 'qcom-distro-catchall' || (matrix.machine == 'qcom-armv7a' && matrix.distro.name == 'qcom-distro')) && matrix.kernel.type == 'default' }}
      machine: ${{matrix.machine}}
      distro_yaml: ${{matrix.distro.yamlfile}}
      distro_name: ${{matrix.distro.name}}
      kernel_yaml: ${{matrix.kernel.yamlfile}}
      kernel_dirname: ${{matrix.kernel.dirname}}
      cache_dir: ${{ needs.compile-env.outputs.CACHE_DIR }}
      profile: ${{ inputs.profile }}

  publish_summary:
    needs: [compile_stage3, compile_sdk]
    if: ${{ always() && github.repository_owner == 'qualcomm-linux' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: qualcomm-linux/meta-qcom/.github/actions/print-build-output@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: build-url*

  build_successful:
    if: ${{ always() && github.repository_owner == 'qualcomm-linux' }}
    needs: [compile_stage3, compile_sdk]
    runs-on: ubuntu-latest
    steps:
      - name: Build completed successfully
        env:
          COMPILE_RESULT: ${{ needs.compile_stage3.result }}
          COMPILE_SDK_RESULT: ${{ needs.compile_sdk.result }}
        run: |
          if [ "${COMPILE_RESULT}" != "success" ] || [ "${COMPILE_SDK_RESULT}" != "success" ]; then
            echo "compile result was ${COMPILE_RESULT}, compile_sdk result was ${COMPILE_SDK_RESULT}"
            exit 1
          fi
          echo "All compile matrix jobs succeeded and artifacts uploaded to S3 bucket"
