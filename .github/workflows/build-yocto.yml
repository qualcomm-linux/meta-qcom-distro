name: Build Yocto

on:
  schedule:
    - cron: '0 3 * * 1-6'  # Every day except Sunday at 3:00 AM UTC
  workflow_call:
    inputs:
      profile:
        required: false
        type: string
        default: "full" # values: pr | full | weekly
    outputs:
      artifacts_url:
        description: "URL to retrieve build artifacts"
        value: ${{ jobs.create-output.outputs.url }}

# Concurrency is used to prevent multiple workflows from running for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

env:
  CACHE_DIR: /efsx/qli/meta-qcom
  KAS_CLONE_DEPTH: 1
  KAS_CONTAINER_IMAGE: ghcr.io/siemens/kas/kas@sha256:3f3d3257e8d4ca3adfcb2e0025e6da24339fb8d68a6999ca36c37381351582d5 # 5.5-9-g0555188

jobs:
  kas-setup:
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - name: Setting up kas-container
        run: |
          KAS_CONTAINER=$RUNNER_TEMP/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          docker create --name kas ${KAS_CONTAINER_IMAGE}
          docker cp kas:/usr/local/bin/kas-container $KAS_CONTAINER
          LATEST=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          if ! grep -q "KAS_CONTAINER_SCRIPT_VERSION=\"${LATEST}\"" $KAS_CONTAINER ; then
            echo "Version "${LATEST}" of kas is available, please update "KAS_CONTAINER_IMAGE: $KAS_CONTAINER_IMAGE""
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run kas lock
        run: |
          ${KAS_CONTAINER} lock --update ci/base.yml:ci/qcom-distro.yml

      - name: Upload kas lockfile
        uses: actions/upload-artifact@v6
        with:
          name: kas-lockfile
          path: ci/*.lock.yml

      - name: Upload kas-container
        uses: actions/upload-artifact@v6
        with:
          name: kas-container
          path: ${{ env.KAS_CONTAINER }}

  yocto-run-checks:
    needs: kas-setup
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: [self-hosted, qcom-u2404, amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download kas lockfile
        uses: actions/download-artifact@v7
        with:
          name: kas-lockfile
          path: ci

      - name: Download kas-container
        uses: actions/download-artifact@v7
        with:
          name: kas-container
          path: ${{ runner.temp }}

      - name: Setting up kas-container
        run: |
          KAS_CONTAINER=$RUNNER_TEMP/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          chmod +x $KAS_CONTAINER

      - name: Run yocto-check-layer
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-check-layer.sh

      - name: Run Yocto patchreview
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-patchreview.sh

  compile_warm_up:
    needs: kas-setup
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: [self-hosted, qcom-u2404, amd64]
    strategy:
      fail-fast: true
      matrix:
        machine:
          - glymur-crd
          - qcom-armv8a
          - rb3gen2-core-kit
        distro:
          - name: qcom-distro
            yamlfile: ':ci/qcom-distro.yml'
        kernel:
          - type: default
            dirname: ""
            yamlfile: ""
    name: ${{ matrix.machine }}/${{ matrix.distro.name }}${{ matrix.kernel.dirname }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run kas build
        uses: ./.github/actions/compile
        with:
          machine: ${{matrix.machine}}
          distro_yaml: ${{matrix.distro.yamlfile}}
          distro_name: ${{matrix.distro.name}}
          kernel_yaml: ${{matrix.kernel.yamlfile}}
          kernel_dirname: ${{matrix.kernel.dirname}}
          cache_dir: ${{env.CACHE_DIR}}

  compile:
    needs: compile_warm_up
    if: github.repository_owner == 'qualcomm-linux'
    runs-on: [self-hosted, qcom-u2404, amd64]
    outputs:
      url: ${{ steps.compile_kas.outputs.url }}
    strategy:
      fail-fast: false
      matrix:
        machine:
          - glymur-crd
          - iq-615-evk
          - iq-8275-evk
          - iq-9075-evk
          - iq-x7181-evk
          - kaanapali-mtp
          - qcm6490-idp
          - qcom-armv8a
          - qcs615-ride
          - qcs8300-ride-sx
          - qcs9100-ride-sx
          - rb1-core-kit
          - rb3gen2-core-kit
          - sm8750-mtp
        distro:
          - name: qcom-distro
            yamlfile: ':ci/qcom-distro.yml'
          - name: qcom-distro-catchall
            yamlfile: ':ci/qcom-distro-catchall.yml'
          - name: performance
            yamlfile: ':ci/qcom-distro.yml:ci/performance.yml'
        kernel:
          - type: default
            dirname: ""
            yamlfile: ""
          - type: qcom-next
            dirname: "_linux-qcom-next"
            yamlfile: ":ci/linux-qcom-next.yml"
          - type: rt-6.18
            dirname: "_linux-qcom-rt-6.18"
            yamlfile: ":ci/linux-qcom-rt-6.18.yml"
        exclude:
          # Exclude jobs from compile_warm_up
          - machine: glymur-crd
            distro:
                name: qcom-distro
            kernel:
                type: default
          - machine: qcom-armv8a
            distro:
                name: qcom-distro
            kernel:
                type: default
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro
            kernel:
                type: default
          # qcom-distro coverage is enough for the non-default qcom-next
          # kernel; 6.18 is the official and supported kernel on this branch
          - distro:
                name: qcom-distro-catchall
            kernel:
                type: qcom-next
          - distro:
                name: performance
            kernel:
                type: qcom-next
        include:
          # Additional builds for specific machines
          - machine: qcom-armv8a
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: additional
                dirname: "_linux-yocto-dev"
                yamlfile: ":ci/linux-yocto-dev.yml"
          - machine: iq-9075-evk
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: qcom-next-rt
                dirname: "_linux-qcom-next-rt"
                yamlfile: ":ci/linux-qcom-next-rt.yml"
          - machine: qcom-armv7a
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro-multimedia-image.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: qcom-armv8a
            distro:
                name: qcom-distro-multimedia-demo-image
                yamlfile: ':ci/qcom-distro-multimedia-demo-image.yml'
                profile: weekly
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro-multimedia-demo-image
                yamlfile: ':ci/qcom-distro-multimedia-demo-image.yml'
                profile: weekly
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: glymur-crd
            distro:
                name: qcom-distro-multimedia-demo-image
                yamlfile: ':ci/qcom-distro-multimedia-demo-image.yml'
                profile: weekly
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
          - machine: qcs615-ride
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom
                dirname: "_u-boot-qcom"
                yamlfile: ":ci/u-boot-qcom.yml"
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: u-boot-qcom
                dirname: "_u-boot-qcom"
                yamlfile: ":ci/u-boot-qcom.yml"
          - machine: rb3gen2-core-kit-open-fw
            distro:
                name: qcom-distro
                yamlfile: ':ci/qcom-distro.yml'
            kernel:
                type: default
                dirname: ""
                yamlfile: ""
    name: ${{ matrix.machine }}/${{ matrix.distro.name }}${{ matrix.kernel.dirname }}
    steps:
      - name: checkout
        if: (inputs.profile != 'pr' || (matrix.distro.name != 'debug' && matrix.distro.name != 'performance')) && (inputs.profile == 'weekly' || matrix.distro.profile != 'weekly')
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run kas build
        if: (inputs.profile != 'pr' || (matrix.distro.name != 'debug' && matrix.distro.name != 'performance')) && (inputs.profile == 'weekly' || matrix.distro.profile != 'weekly')
        uses: ./.github/actions/compile
        id: compile_kas
        with:
          machine: ${{matrix.machine}}
          distro_yaml: ${{matrix.distro.yamlfile}}
          distro_name: ${{matrix.distro.name}}
          kernel_yaml: ${{matrix.kernel.yamlfile}}
          kernel_dirname: ${{matrix.kernel.dirname}}
          cache_dir: ${{env.CACHE_DIR}}

  publish_summary:
    needs: compile
    if: ${{ always() && github.repository_owner == 'qualcomm-linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: qualcomm-linux/meta-qcom/.github/actions/print-build-output@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: build-url*

  build_successful:
    if: ${{ always() && github.repository_owner == 'qualcomm-linux' }}
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Build completed successfully
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
        run: |
          if [ "${COMPILE_RESULT}" != "success" ]; then
            echo "compile result was ${COMPILE_RESULT}"
            exit 1
          fi
          echo "All compile matrix jobs succeeded and artifacts uploaded to S3 bucket"
