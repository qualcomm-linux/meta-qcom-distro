name: Weekly Build

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 3:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-weekly:
    permissions:
      contents: read
      packages: read
      actions: read
    uses: ./.github/workflows/build-yocto.yml
    with:
      profile: weekly
